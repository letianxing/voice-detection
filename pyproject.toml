[project]
name = "voice-detection"
version = "0.1.0"
description = "Cocktail-party acoustic frontend for ROS4HRI robot perception."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
live = ["sounddevice>=0.4", "sherpa-onnx>=1.13.8"]
scene = ["einops>=0.6", "scipy>=1.10", "librosa>=0.10", "torch>=2.6", "torchaudio>=2.6", "transformers>=4.40", "huggingface-hub>=0.25", "websocket-client>=1.7"]
ros = ["rclpy"]

[tool.setuptools]
packages = ["voice_detection"]
