[project]
name = "voice-detection"
version = "0.1.0"
description = "Cocktail-party acoustic frontend for ROS4HRI robot perception."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
live = ["sounddevice>=0.4", "sherpa-onnx>=1.13.8"]
ros = ["rclpy"]

[tool.setuptools]
packages = ["voice_detection"]
